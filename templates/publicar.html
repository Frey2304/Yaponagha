<!DOCTYPE html>
<html>
<head>
    <title>Publicar</title>
</head>

<body style="background:black; color:white; font-family:Arial;">

<h1 style="color:gold;">
    Publicar Caballo
</h1>

<form method="POST" enctype="multipart/form-data">

    <input
        name="nombre"
        placeholder="Nombre"
    >

    <br><br>

    <textarea
        name="descripcion"
        placeholder="Descripción"
        rows="5"
        cols="40"
    ></textarea>

    <br><br>

    <input
        type="file"
        name="imagen"
    >

    <br><br>

    <button type="submit">
        Publicar
    </button>

</form>

<br>

<a href="/">
    Volver
</a>

</body>
</html>
